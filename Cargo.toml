[package]
name = "jarvus"
version = "0.1.0"
edition = "2024"
description = "Local-first Windows desktop assistant and automation interface"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard"] }
egui-pop-phosphor = "0.15.0"
egui_commonmark = { version = "0.26", default-features = false }
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["blocking", "json", "rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
url = "2.5.8"
webbrowser = "1.2.6"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
# UI Automation COM bindings (already in the dependency graph): read the focused
# control in milliseconds instead of a multi-second agent-desktop tree walk.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native pointer/keyboard events (the same version eframe already pulls in on macOS).
core-graphics = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
