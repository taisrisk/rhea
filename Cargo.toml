[package]
name = "rhea"
version = "0.1.1"
edition = "2024"
description = "Rhea: local-first desktop assistant for Windows and macOS"

[dependencies]
base64 = "0.23.1"
candle-core = "0.9"
candle-nn = "0.9"
candle-transformers = "0.9"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "accesskit", "clipboard"] }
egui-pop-phosphor = "0.15.0"
egui_commonmark = { version = "0.26", default-features = false }
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["blocking", "json", "rustls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
spellbook = "0.4.2"
tar = "0.4"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
url = "2.5.8"
webbrowser = "1.2.6"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_SystemInformation"] }
# UI Automation COM bindings (already in the dependency graph): read the focused
# control in milliseconds instead of a multi-second agent-desktop tree walk.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Native pointer/keyboard events (the same version eframe already pulls in on macOS).
core-graphics = "0.23"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"

# egui with one patch: text selection survives scrolling (see vendor/egui and THIRD_PARTY.md)
[patch.crates-io]
egui = { path = "vendor/egui" }
