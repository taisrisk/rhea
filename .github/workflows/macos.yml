name: macOS build

# Builds, tests and packages JARVUS for macOS (Apple Silicon and Intel). The Windows build is made
# on a PC and uploaded to the release by hand (scripts/release.ps1 -Upload); publishing a release
# makes this workflow attach the macOS .dmg and .zip files to it automatically.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the macOS builds to (leave empty to only build)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  AGENT_DESKTOP_VERSION: "1.2.0"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            asset_arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            asset_arch: x64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}

      - name: Install Agent Desktop (used by the tests and bundled in the app)
        run: |
          npm install --global "agent-desktop@${AGENT_DESKTOP_VERSION}"
          agent-desktop version

      - name: Test
        run: cargo test --locked --bin jarvus --target ${{ matrix.rust_target }}

      - name: Build
        run: cargo build --release --locked --bin jarvus --target ${{ matrix.rust_target }}

      - name: Package .app, .zip and .dmg
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash packaging/macos/package.sh "${{ matrix.rust_target }}" "${{ matrix.asset_arch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jarvus-macos-${{ matrix.asset_arch }}
          path: |
            dist/JARVUS-v*-macos-*.dmg
            dist/JARVUS-v*-macos-*.zip
          if-no-files-found: error
          retention-days: 14

  attach-release-assets:
    name: Attach macOS builds to the release
    needs: build
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: jarvus-macos-*
          path: dist
          merge-multiple: true

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          ls -l dist
          gh release upload "$RELEASE_TAG" dist/*.dmg dist/*.zip --clobber
